services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-museum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-museum}
    volumes:
      - museum-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "db:migrate"]
    environment: &api-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-museum}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-museum}
      MODEL_STORAGE_PATH: /app/storage/models
      NODE_ENV: production
    volumes:
      - ./storage/models:/app/storage/models:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    volumes:
      - ./storage/models:/app/storage/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  museum-db:
